{% extends "tasks/base.html" %}

{% block title %}Удаление шаблона{% endblock %}

{% block content %}
<div class="page page--narrow">
    <a href="{% url 'tasks:project_list' %}" class="back">← Проекты</a>
    <div class="confirm-card">
        <h1>Удалить шаблон?</h1>
        <p>
            Шаблон «{{ template.name }}» будет удалён вместе со списком его задач.
            Проекты, уже созданные по этому шаблону, не изменятся.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="form__actions">
                <button type="submit" class="btn btn--danger">Удалить</button>
                <a href="{% url 'tasks:project_list' %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
