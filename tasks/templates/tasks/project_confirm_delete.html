{% extends "tasks/base.html" %}

{% block title %}Удаление проекта{% endblock %}

{% block content %}
<div class="page page--narrow">
    <a href="{% url 'tasks:project_list' %}" class="back">← Проекты</a>
    <div class="confirm-card">
        <h1>Удалить проект?</h1>
        <p>
            Проект «{{ project.name }}» будет удалён вместе со всеми связанными задачами.
            Это действие нельзя отменить.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="form__actions">
                <button type="submit" class="btn btn--danger">Удалить</button>
                <a href="{% url 'tasks:project_list' %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
