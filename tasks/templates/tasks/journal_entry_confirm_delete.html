{% extends "tasks/base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="page page--narrow">
    <a href="{% url 'tasks:journal' %}" class="back">← Журнал</a>
    <div class="confirm-card">
        <h1>Удалить запись?</h1>
        <p>Запись «{{ journalentry.text }}» за {{ journalentry.date|date:"d.m.Y" }} будет удалена. Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form__actions">
                <button type="submit" class="btn btn--danger">Удалить</button>
                <a href="{% url 'tasks:journal' %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
