{% extends "tasks/base.html" %}

{% block title %}Удаление задачи{% endblock %}

{% block content %}
<div class="page page--narrow">
    <a href="{% url 'tasks:task_detail' task.pk %}" class="back">← Назад</a>
    <div class="confirm-card">
        <h1>Удалить задачу?</h1>
        <p>Задача «{{ task.name }}» будет удалена. Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form__actions">
                <button type="submit" class="btn btn--danger">Удалить</button>
                <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
