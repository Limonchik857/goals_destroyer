{% extends "tasks/base.html" %}

{% block title %}Удаление заметки{% endblock %}

{% block content %}
<div class="page page--narrow">
    <a href="{% url 'tasks:note_list' %}" class="back">← Заметки</a>
    <div class="confirm-card">
        <h1>Удалить заметку?</h1>
        <p>Заметка «{{ note.title }}» будет удалена. Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form__actions">
                <button type="submit" class="btn btn--danger">Удалить</button>
                <a href="{% url 'tasks:note_list' %}" class="btn btn--ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
