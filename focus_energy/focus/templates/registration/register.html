{% extends 'focus/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Регистрация</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
  <p class="auth-link">Уже есть аккаунт? <a href="{% url 'focus:login' %}">Войти</a></p>
</div>
{% endblock %}
