{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Фокус и энергия{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'focus/css/style.css' %}">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="{% url 'focus:dashboard' %}" class="logo">Фокус и энергия</a>
      {% if user.is_authenticated %}
      <nav class="nav">
        <a href="{% url 'focus:dashboard' %}" class="nav-link">Главная</a>
        <a href="{% url 'focus:task_list' %}" class="nav-link">Задачи</a>
        <a href="{% url 'focus:history' %}" class="nav-link">История</a>
        <form method="post" action="{% url 'focus:logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-logout">Выйти</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="main">
    <div class="container">
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <div class="message message-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
